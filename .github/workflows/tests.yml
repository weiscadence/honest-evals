name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      - name: example reproduces its headline
        run: python examples/selection_effect.py
  studies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pytest requests openai
      - name: limit-eval
        working-directory: studies/limit-eval
        run: |
          python -m pytest -q
          python -m limit_eval.verify
      - name: addup-agent
        working-directory: studies/addup-agent
        run: python -m pytest -q tests
      - name: self-report-v2
        working-directory: studies/self-report-v2
        run: node --test harness/score.test.js
